name: basic_facts
description: "Verify baseline extraction of common personal facts (location, employer, pets)."

conversations:
  - session_id: bf-s1
    user_id: bf-u1
    timestamp: 2025-03-10T10:00:00Z
    messages:
      - role: user
        content: "Hey! I just moved to Berlin last month. Still getting used to the city."
      - role: assistant
        content: "Welcome to Berlin! How are you finding it so far?"
      - role: user
        content: >
          I love it. I work at Notion as a product manager and the office is
          great. Oh, and I have a golden retriever named Biscuit who absolutely
          loves the parks here.
      - role: assistant
        content: "Sounds lovely! Biscuit must enjoy the Tiergarten."

probes:
  - query: "Where does the user live?"
    session_id: bf-probe
    user_id: bf-u1
    max_tokens: 512
    expected_facts:
      - "Berlin"
    not_expected_facts: []

  - query: "What does the user do for work?"
    session_id: bf-probe
    user_id: bf-u1
    max_tokens: 512
    expected_facts:
      - "Notion"
    not_expected_facts: []

  - query: "Does the user have any pets?"
    session_id: bf-probe
    user_id: bf-u1
    max_tokens: 512
    expected_facts:
      - "Biscuit"
    not_expected_facts: []
