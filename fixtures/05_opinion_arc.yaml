name: opinion_arc
description: "Verify opinion representation captures evolving views. 
  Without opinion_view synthesis, context shows raw fragments 
  without coherent arc. Key check: does the context reflect the CURRENT 
  pragmatic stance, not just the initial enthusiasm?"

conversations:
  - session_id: oa-s1
    user_id: oa-u1
    timestamp: 2025-01-05T10:00:00Z
    messages:
      - role: user
        content: "Been using TypeScript on a new project and I absolutely 
          love it. The type safety catches so many bugs before runtime."
      - role: assistant
        content: "TypeScript really shines on larger codebases!"

  - session_id: oa-s2
    user_id: oa-u1
    timestamp: 2025-02-10T10:00:00Z
    messages:
      - role: user
        content: "Ugh, TypeScript generics are really frustrating me today. 
          The type complexity is getting out of hand. Sometimes I miss 
          just writing plain JavaScript."
      - role: assistant
        content: "Deeply nested generics can be rough."

  - session_id: oa-s3
    user_id: oa-u1
    timestamp: 2025-03-20T10:00:00Z
    messages:
      - role: user
        content: "I've settled on a pragmatic view — TypeScript for team 
          projects, Python for personal scripts. It's a tool, not a religion."
      - role: assistant
        content: "That's a healthy way to look at it."

probes:
  - query: "What does the user currently think about TypeScript?"
    session_id: oa-probe
    user_id: oa-u1
    max_tokens: 512
    expected_facts:
      - "pragmatic"
    not_expected_facts:
      - "love it"
      - "absolutely love"