name: multi_hop
description: >
  Verify 2-hop entity traversal: Luna (cat) and Amsterdam (city) come from
  completely separate sessions with no linguistic overlap.
  The probe query asks about the cat's location without mentioning "city" or
  "Amsterdam", so cosine-only retrieval cannot bridge the gap once noise fills
  top-k. Noise deliberately includes travel sessions with "evening" + foreign
  city content, which outrank the Amsterdam memory on both cosine and FTS for
  any evening-location query, displacing it from top-10. Graph traversal
  (Luna → owned_by → mh-u1 → lives_in → Amsterdam) is the only reliable path.
  Expected to FAIL at Stage 3, PASS at Stage 5.

conversations:

  # ── Core case ────────────────────────────────────────────────────────────
  # Session 1: establishes that the user owns a cat named Luna.
  - session_id: mh-s1
    user_id: mh-u1
    timestamp: 2025-03-01T10:00:00Z
    messages:
      - role: user
        content: "Got a new cat last year, her name is Luna. She's a tabby,
          very chatty, always wants attention when I'm working."
      - role: assistant
        content: "Luna sounds like quite the character!"
      - role: user
        content: "She really is. Best decision I ever made getting her."

  # Session 2: establishes the user's city. No mention of Luna or pets.
  # Deliberately omits weather/nature vocabulary to reduce cosine overlap
  # with any cat-behaviour query.
  - session_id: mh-s2
    user_id: mh-u1
    timestamp: 2025-03-10T10:00:00Z
    messages:
      - role: user
        content: "Just got back from a long bike ride around the canals."
      - role: assistant
        content: "Where are you based?"
      - role: user
        content: "Amsterdam. Moved here from Rotterdam four years ago."

  # ── Noise ────────────────────────────────────────────────────────────────
  # Sessions designed to fill top-k with evening+city memories that are NOT
  # Amsterdam. The first six are travel episodes: each contains "evening(s)"
  # and a foreign city, so they outrank the Amsterdam memory on cosine for any
  # evening-location probe (the Amsterdam memory never mentions "evening").
  # The remaining sessions are lifestyle facts that add retrieval depth.
  - session_id: mh-noise-01
    user_id: mh-u1
    timestamp: 2025-02-01T10:00:00Z
    messages:
      - role: user
        content: "Just back from a conference in Berlin. Spent three evenings
          walking around Mitte — the neighbourhood has a completely different
          energy after dark."

  - session_id: mh-noise-02
    user_id: mh-u1
    timestamp: 2025-02-03T10:00:00Z
    messages:
      - role: user
        content: "Short work trip to Copenhagen last month. The harbour evenings
          were something else — people just bundle up and stay outside
          no matter the cold."

  - session_id: mh-noise-03
    user_id: mh-u1
    timestamp: 2025-02-05T10:00:00Z
    messages:
      - role: user
        content: "Spent a long weekend in Lisbon. Evenings in Alfama were
          incredible — fado coming out of every door, steep cobblestone streets."

  - session_id: mh-noise-04
    user_id: mh-u1
    timestamp: 2025-02-07T10:00:00Z
    messages:
      - role: user
        content: "Had a layover in Vienna and managed an evening in the Naschmarkt
          area. Stayed out late just wandering — the city is built for that."

  - session_id: mh-noise-05
    user_id: mh-u1
    timestamp: 2025-02-09T10:00:00Z
    messages:
      - role: user
        content: "Warsaw for a week in January. Evenings were surprisingly lively
          for winter — the old town is beautifully lit after dark."

  - session_id: mh-noise-06
    user_id: mh-u1
    timestamp: 2025-02-11T10:00:00Z
    messages:
      - role: user
        content: "Quick trip to Prague last year. The evenings there feel almost
          theatrical — bridges, river, old buildings all lit up."

  - session_id: mh-noise-07
    user_id: mh-u1
    timestamp: 2025-02-13T10:00:00Z
    messages:
      - role: user
        content: "Got a standing desk last year. I alternate sitting and
          standing roughly every hour. Back pain is basically gone."

  - session_id: mh-noise-08
    user_id: mh-u1
    timestamp: 2025-02-15T10:00:00Z
    messages:
      - role: user
        content: "I've been learning Spanish for eight months using
          Anki and a weekly tutor. Can hold basic conversations now."

  - session_id: mh-noise-09
    user_id: mh-u1
    timestamp: 2025-02-17T10:00:00Z
    messages:
      - role: user
        content: "Baking sourdough every weekend. My starter is two years
          old and I've named it Herbert."

  - session_id: mh-noise-10
    user_id: mh-u1
    timestamp: 2025-02-19T10:00:00Z
    messages:
      - role: user
        content: "Big into strategy games — Factorio, Dwarf Fortress,
          that kind of thing. I find them meditative rather than stressful."

  - session_id: mh-noise-11
    user_id: mh-u1
    timestamp: 2025-02-21T10:00:00Z
    messages:
      - role: user
        content: "I do landscape photography as a hobby. Shoot on a Sony
