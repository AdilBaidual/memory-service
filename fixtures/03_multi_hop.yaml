probes:
  # Query deliberately avoids "city" / "live" / "Amsterdam" so cosine cannot
  # shortcut directly to the Amsterdam memory. Answer requires the chain:
  # Luna → owned_by → mh-u1 → lives_in → Amsterdam.
  - query: "Where does the user's cat Luna typically spend her evenings?"
    session_id: mh-probe
    user_id: mh-u1
    max_tokens: 512
    expected_facts:
      - "Amsterdam"
    not_expected_facts: []
